<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Cut repeats, group related ideas, and count the cover and close within a ten-slide limit."><title>Cut repeats, group related ideas, and count the cover and close within a ten-slide limit.</title><g font-family="Space Grotesk, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0071E3" stroke="none"/><text x="64" y="96" font-size="28" font-weight="600" fill="#FFFFFF" letter-spacing="0">skills</text><text x="882" y="96" font-size="26" font-weight="400" fill="#FFFFFF" letter-spacing="0">03 / 05</text><text x="64" y="245" font-size="100" font-weight="600" fill="#FFFFFF" letter-spacing="-2.5">Keep the</text><text x="64" y="355" font-size="100" font-weight="600" fill="#FFFFFF" letter-spacing="-2.5">strongest</text><text x="64" y="465" font-size="100" font-weight="600" fill="#FFFFFF" letter-spacing="-2.5">parts.</text><text x="64" y="719" font-size="38" font-weight="400" fill="#FFFFFF" letter-spacing="0">Cut repeats.</text><text x="64" y="793" font-size="38" font-weight="400" fill="#FFFFFF" letter-spacing="0">Group related ideas.</text><text x="64" y="867" font-size="38" font-weight="400" fill="#FFFFFF" letter-spacing="0">Leave room for the close.</text><path d="M64 1062h952" stroke="#81BAF1" stroke-width="2"/><text x="64" y="1138" font-size="42" font-weight="600" fill="#FFFFFF" letter-spacing="0">Up to 10 slides.</text><text x="64" y="1194" font-size="30" font-weight="400" fill="#FFFFFF" letter-spacing="0">Count the cover and the close.</text><rect x="64" y="1280" width="177.6" height="5" rx="0" fill="#FFFFFF" stroke="none"/><rect x="257.6" y="1280" width="177.6" height="5" rx="0" fill="#FFFFFF" stroke="none"/><rect x="451.2" y="1280" width="177.6" height="5" rx="0" fill="#FFFFFF" stroke="none"/><rect x="644.8" y="1280" width="177.6" height="5" rx="0" fill="#39516A" stroke="none"/><rect x="838.4" y="1280" width="177.6" height="5" rx="0" fill