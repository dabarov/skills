name: Meme Reel feedback
description: Report a result or correction from using Build Meme Reel.
title: "[Meme Reel] "
labels: []
body:
  - type: textarea
    id: request
    attributes:
      label: What did you ask for?
      description: Include the prompt and agent. Remove private paths and source media you cannot share.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Describe the cut, effect, engagement, cover, caption, or setup problem. Include the relevant error if one appeared.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What correction helped?
      description: A concrete before/after example is useful.
